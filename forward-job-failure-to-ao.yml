---
# Forward an AAP job-failure into Automation Orchestrator.
# Used by "AO | Forward Job Failure" (notification, workflow on-failure, or manual launch).
- name: Forward job failure to Automation Orchestrator
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ao_base_url: "{{ ao_base_url | mandatory }}"
    ao_client_id: "{{ ao_client_id | mandatory }}"
    ao_client_secret: "{{ ao_client_secret | mandatory }}"
    ao_webhook_path: "{{ ao_webhook_path | default('aap-job-failed') }}"
    # Launch/survey extra_vars win over set_fact — never rely on overriding failed_job_id in place.
    failed_job_id: "{{ failed_job_id | default(0) }}"
    failed_job_name: "{{ failed_job_name | default('AO Demo | Broken localhost playbook') }}"
    failed_job_status: "{{ failed_job_status | default('failed') }}"
    # Container-group EEs hostAlias AAP to the gateway ClusterIP (HTTP/80). HTTPS to that alias times out.
    aap_api_url: "{{ aap_api_url | default('http://aap-aap-operator.apps.127.0.0.1.nip.io') }}"
  tasks:
    - name: Skip recursive notifications from this forwarder
      ansible.builtin.meta: end_play
      when: "'Forward Job Failure' in (failed_job_name | string)"

    - name: Seed resolved job fields from launch variables
      ansible.builtin.set_fact:
        resolved_failed_job_id: "{{ failed_job_id | int }}"
        resolved_failed_job_name: "{{ failed_job_name }}"
        resolved_failed_job_status: "{{ failed_job_status }}"

    - name: Resolve failed job id when not provided
      when: (resolved_failed_job_id | int) == 0
      block:
        - name: Require AAP API credential for job lookup
          ansible.builtin.assert:
            that:
              - aap_api_username is defined
              - aap_api_password is defined
            fail_msg: >-
              failed_job_id is 0/missing; provide failed_job_id or attach an AAP API credential
              that injects aap_api_username / aap_api_password.

        - name: Read current job id from the execution environment
          ansible.builtin.set_fact:
            forwarder_job_id: "{{ lookup('env', 'JOB_ID') | default('', true) }}"

        - name: Prefer sibling failed job from the parent workflow
          when: forwarder_job_id | length > 0
          block:
            - name: Retrieve this forwarder job metadata
              ansible.builtin.uri:
                url: "{{ aap_api_url }}/api/controller/v2/jobs/{{ forwarder_job_id }}/"
                user: "{{ aap_api_username }}"
                password: "{{ aap_api_password }}"
                force_basic_auth: true
                validate_certs: false
                status_code: [200]
              register: forwarder_job
              no_log: true

            - name: Capture source workflow job id
              ansible.builtin.set_fact:
                source_workflow_job_id: >-
                  {{ forwarder_job.json.summary_fields.source_workflow_job.id
                     | default(0, true) }}

            - name: List parent workflow nodes
              when: (source_workflow_job_id | int) > 0
              ansible.builtin.uri:
                url: "{{ aap_api_url }}/api/controller/v2/workflow_jobs/{{ source_workflow_job_id }}/workflow_nodes/?page_size=100"
                user: "{{ aap_api_username }}"
                password: "{{ aap_api_password }}"
                force_basic_auth: true
                validate_certs: false
                status_code: [200]
              register: workflow_nodes
              no_log: true

            - name: Pick failed sibling job from workflow
              when:
                - (source_workflow_job_id | int) > 0
                - (workflow_nodes.json.results | default([])) | length > 0
              vars:
                failed_siblings: >-
                  {{
                    workflow_nodes.json.results
                    | selectattr('summary_fields.job', 'defined')
                    | selectattr('summary_fields.job.failed')
                    | list
                  }}
              ansible.builtin.set_fact:
                resolved_failed_job_id: "{{ (failed_siblings | map(attribute='summary_fields.job.id') | list | first) | default(0, true) }}"
                resolved_failed_job_name: "{{ (failed_siblings | map(attribute='summary_fields.job.name') | list | first) | default(resolved_failed_job_name, true) }}"

        - name: Fall back to latest failed job search by name
          when: (resolved_failed_job_id | int) == 0
          block:
            - name: Look up latest failed job by name
              ansible.builtin.uri:
                url: >-
                  {{ aap_api_url }}/api/controller/v2/jobs/?search={{ 'Broken localhost' | urlencode }}&status=failed&order_by=-finished&page_size=5
                user: "{{ aap_api_username }}"
                password: "{{ aap_api_password }}"
                force_basic_auth: true
                validate_certs: false
                return_content: true
                status_code: [200, 401, 403, 404]
              register: failed_jobs_lookup
              no_log: true

            - name: Require a successful job lookup response
              ansible.builtin.assert:
                that:
                  - failed_jobs_lookup.status == 200
                fail_msg: >-
                  AAP job lookup failed with HTTP {{ failed_jobs_lookup.status | default('unknown') }}.
                  Check the aap-demo API admin credential (username/password must authenticate to
                  {{ aap_api_url }}).

            - name: Require at least one failed job match
              ansible.builtin.assert:
                that:
                  - (failed_jobs_lookup.json.results | default([])) | length > 0
                fail_msg: "No failed jobs found matching 'Broken localhost'"

            - name: Set resolved failed job from lookup
              ansible.builtin.set_fact:
                resolved_failed_job_id: "{{ failed_jobs_lookup.json.results[0].id }}"
                resolved_failed_job_name: "{{ failed_jobs_lookup.json.results[0].name | default(resolved_failed_job_name) }}"

    - name: Require a concrete failed job id before calling AO
      ansible.builtin.assert:
        that:
          - (resolved_failed_job_id | int) > 0
        fail_msg: "Could not resolve a failed_job_id to send to Automation Orchestrator"

    - name: Obtain AO service account token
      ansible.builtin.uri:
        url: "{{ ao_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ ao_client_id }}"
          client_secret: "{{ ao_client_secret }}"
        validate_certs: false
        status_code: [200]
      register: ao_token
      no_log: true

    - name: Post failure payload to AO webhook
      ansible.builtin.uri:
        url: "{{ ao_base_url }}/api/v1/webhooks/{{ ao_webhook_path }}"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_token.json.access_token }}"
          Content-Type: application/json
        body_format: json
        body:
          job_id: "{{ resolved_failed_job_id | int }}"
          name: "{{ resolved_failed_job_name }}"
          status: "{{ resolved_failed_job_status }}"
          source: aap-forwarder
        validate_certs: false
        status_code: [202]
      register: ao_webhook

    - name: Show AO workflow execution id
      ansible.builtin.debug:
        msg: >-
          AO workflow started: {{ ao_webhook.json.execution_id | default(ao_webhook.json) }}
          for job {{ resolved_failed_job_id }}
